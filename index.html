  <!-- Telegram WebApp SDK (loaded conditionally without blocking standalone web) -->
  <script>
    (function() {
      var isTg = window.TelegramWebviewProxy || 
                 window.location.search.indexOf('tgWebAppData') !== -1 ||
                 window.location.search.indexOf('tgWebAppStartParam') !== -1;
      if (isTg) {
        var s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.async = true;
        document.head.appendChild(s);
      }
    })();
    // [Optimization] Warm up the API serverless functions in parallel
    fetch('/api/time', { method: 'GET', cache: 'no-cache' }).catch(function() {});
  </script>
  
  <style>

  <style>

<body>
  <div id="root">
    <div style="
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      color: #c8a870; 
      font-family: 'Cinzel', serif; 
      text-align: center;
      gap: 20px;
    ">
      <div style="font-size: 24px; letter-spacing: 2px;">MASTERS OF THE WILD</div>
      <div style="width: 200px; height: 4px; background: rgba(200, 168, 112, 0.2); border-radius: 2px; overflow: hidden; position: relative;">
        <div style="
          position: absolute; 
          height: 100%; 
          width: 50%; 
          background: #f0c040; 
          box-shadow: 0 0 15px #f0c040;
          animation: loading-anim 1.5s infinite ease-in-out;
        "></div>
      </div>
      <div style="font-size: 14px; opacity: 0.6; font-family: sans-serif;">Загрузка ресурсов...</div>
      <style>
        @keyframes loading-anim {
          0% { left: -50%; }
          100% { left: 100%; }
        }
      </style>
    </div>
  </div>

  <script>
    // [Global QA logger] Отчет об ошибках в дев-сервер
    (function() {
      function logErr(message, source, lineno, colno, errorObj) {
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message || 'Unknown Error',
            source: source || 'unknown',
            line: lineno || 0,
            col: colno || 0,
            stack: errorObj ? errorObj.stack : ''
          })
        }).catch(() => {});
      }
      window.addEventListener('error', function(e) {
        if (e.message) {
          logErr(e.message, e.filename, e.lineno, e.colno, e.error);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        const reason = e.reason || {};
        logErr('Unhandled Rejection: ' + (reason.message || reason), reason.filename || '', reason.lineno || 0, reason.colno || 0, reason);
      });
    })();

    // [Recovery] Detect critical script load failure only (not non-critical images or stylesheets)
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('main.tsx')) {
        const root = document.getElementById('root');
        if (root && root.innerHTML.includes('Загрузка ресурсов')) {
          root.innerHTML = `
            <div style="color: #ff4444; padding: 40px; text-align: center; font-family: sans-serif; background: #0a0a1a; position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
              <h2 style="font-family: 'Cinzel', serif; color: #f0c040;">Ошибка загрузки игры</h2>
              <p style="color: #aaa; max-width: 500px; margin: 20px 0;">Не удалось загрузить основной скрипт игры. Проверьте соединение с интернетом.</p>
              <button onclick="window.location.reload()" style="padding: 12px 24px; background: #f0c040; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">ПОПРОБОВАТЬ СНОВА</button>
            </div>
          `;
        }
      }
    }, true);
  </script>

  <script>
    // [Debug] Mobile console integration (disabled in production build to ensure zero external CDN dependencies)
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
