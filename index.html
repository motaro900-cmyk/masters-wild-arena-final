<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Masters of the Wild</title>
  <meta name="description" content="Управляйте героями, сражайтесь в автоматических битвах и покоряйте рейтинги в Masters of the Wild!" />
  <meta property="og:title" content="Masters of the Wild — Арена Животных" />
  <meta property="og:description" content="Соберите свою команду диких зверей и станьте легендой арены!" />
  <meta property="og:image" content="/assets/images/ui/promo_banner.png" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Outfit:wght@400;700;800;900&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  
  <!-- Preload Critical Assets -->
  <link rel="preload" href="/assets/images/backgrounds/bg_main.webp" as="image">
  <script>
    // [Optimization] Immediately "use" the preloaded resource to satisfy browser checks
    // This prevents the "Preloaded but not used within a few seconds" warning.
    (new Image()).src = "/assets/images/backgrounds/bg_main.webp";
  </script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #05050a;
    }
    
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .font-header {
      font-family: 'Philosopher', serif;
    }

    .font-ui {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Russo+One&display=swap"
    rel="stylesheet">
  <style>
    /* Сброс стилей */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-text-size-adjust: none;
      -moz-text-size-adjust: none;
      -ms-text-size-adjust: none;
      text-size-adjust: none;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas PixiJS rendering sharpness */
    canvas {
      image-rendering: auto;
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      color: #c8a870; 
      font-family: 'Cinzel', serif; 
      text-align: center;
      gap: 20px;
    ">
      <div style="font-size: 24px; letter-spacing: 2px;">MASTERS OF THE WILD</div>
      <div style="width: 200px; height: 4px; background: rgba(200, 168, 112, 0.2); border-radius: 2px; overflow: hidden; position: relative;">
        <div style="
          position: absolute; 
          height: 100%; 
          width: 50%; 
          background: #f0c040; 
          box-shadow: 0 0 15px #f0c040;
          animation: loading-anim 1.5s infinite ease-in-out;
        "></div>
      </div>
      <div style="font-size: 14px; opacity: 0.6; font-family: sans-serif;">Загрузка ресурсов...</div>
      <style>
        @keyframes loading-anim {
          0% { left: -50%; }
          100% { left: 100%; }
        }
      </style>
    </div>
  </div>

  <script>
    // [Global QA logger] Отчет об ошибках в дев-сервер
    (function() {
      function logErr(message, source, lineno, colno, errorObj) {
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message || 'Unknown Error',
            source: source || 'unknown',
            line: lineno || 0,
            col: colno || 0,
            stack: errorObj ? errorObj.stack : ''
          })
        }).catch(() => {});
      }
      window.addEventListener('error', function(e) {
        if (e.message) {
          logErr(e.message, e.filename, e.lineno, e.colno, e.error);
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        const reason = e.reason || {};
        logErr('Unhandled Rejection: ' + (reason.message || reason), reason.filename || '', reason.lineno || 0, reason.colno || 0, reason);
      });
    })();

    // [Recovery] Detect module load failure (e.g. CDN/Cert errors)
    window.addEventListener('error', function(e) {
      if (e.target && (e.target.src || e.target.href)) {
        const root = document.getElementById('root');
        if (root && root.innerHTML.includes('Загрузка ресурсов')) {
          root.innerHTML = `
            <div style="color: #ff4444; padding: 40px; text-align: center; font-family: sans-serif; background: #0a0a1a; position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justifyContent: center;">
              <h2 style="font-family: 'Cinzel', serif; color: #f0c040;">Ошибка загрузки файлов игры</h2>
              <p style="color: #aaa; max-width: 500px; margin: 20px 0;">Не удалось загрузить компоненты игры. Это может быть связано с плохим соединением или проблемами с сертификатом безопасности (Let's Encrypt).</p>
              <button onclick="window.location.reload()" style="padding: 12px 24px; background: #f0c040; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">ПОПРОБОВАТЬ СНОВА</button>
            </div>
          `;
        }
      }
    }, true);
  </script>

  <script>
    // [Debug] Mobile console integration
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('eruda') === 'true' || urlParams.get('debug') === '1') {
            const script = document.createElement('script');
            script.src = "//cdn.jsdelivr.net/npm/eruda";
            document.body.appendChild(script);
            script.onload = function () {
                eruda.init();
                console.log('[Debug] Eruda initialized');
            }
        }
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
