<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masters of the Wild</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    .font-header {
      font-family: 'Philosopher', serif;
    }

    .font-ui {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Russo+One&display=swap"
    rel="stylesheet">
  <style>
    /* Сброс стилей */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Контейнер игры — фиксированные пропорции 16:9 */
    #game-container {
      width: 100vw;
      height: calc(100vw * 9 / 16);
      max-width: 100%;
      max-height: 100vh;
      position: relative;
      overflow: hidden;
      background: #0a0a1a;
    }

    /* Canvas PixiJS */
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      /* Резкость + контраст на уровне браузера (GPU, без нагрузки на CPU) */
      filter: contrast(1.15) saturate(1.2);
      image-rendering: crisp-edges;
    }
  </style>
</head>

<body>
  <div id="root">
    <div style="
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      color: #c8a870; 
      font-family: 'Cinzel', serif; 
      text-align: center;
      gap: 20px;
    ">
      <div style="font-size: 24px; letter-spacing: 2px;">МАСТЕР ДИКОЙ ПРИРОДЫ</div>
      <div style="width: 200px; height: 4px; background: rgba(200, 168, 112, 0.2); border-radius: 2px; overflow: hidden; position: relative;">
        <div style="
          position: absolute; 
          height: 100%; 
          width: 50%; 
          background: #f0c040; 
          box-shadow: 0 0 15px #f0c040;
          animation: loading-anim 1.5s infinite ease-in-out;
        "></div>
      </div>
      <div style="font-size: 14px; opacity: 0.6; font-family: sans-serif;">Загрузка ресурсов...</div>
      <style>
        @keyframes loading-anim {
          0% { left: -50%; }
          100% { left: 100%; }
        }
      </style>
    </div>
  </div>

  <script>
    // [Anti-Tamper] Disable Context Menu
    document.addEventListener('contextmenu', e => e.preventDefault());
    
    // [Anti-Tamper] Disable F12 and Ctrl+Shift+I
    document.onkeydown = function(e) {
      if (e.keyCode == 123) return false; // F12
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
      if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
    };
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
