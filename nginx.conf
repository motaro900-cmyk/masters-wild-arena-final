# Sample Nginx configuration for hosting the game on a standard VPS.
# This config serves the React/Vite static assets directly (very fast)
# and proxies all backend '/api/*' calls to the Node.js Express server.

server {
    listen 80;
    listen [::]:80;
    server_name mastersofthewild.ru www.mastersofthewild.ru;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mastersofthewild.ru www.mastersofthewild.ru;

    # SSL Certificates (managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/mastersofthewild.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastersofthewild.ru/privkey.pem;

    # Optimized SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Root directory pointing to the built frontend files ('dist' folder)
    root /var/www/masters-of-the-wild/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "ALLOWALL" always; # Required for VK Mini App iframe
    add_header Content-Security-Policy "frame-ancestors *" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Compress assets using Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Serve static frontend files and handle client SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (Vite assets have hashes in names, so safe to cache long-term)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy API requests to Node.js backend (running on port 3000 via PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
